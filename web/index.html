<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawing Review</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #20252b; background: #f4f6f7; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #d9dee2; padding: 18px 28px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #d9dee2; border-radius: 8px; padding: 24px; }
    .upload { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 5px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button.primary { background: #1f4f6e; color: white; }
    .muted { color: #65717a; font-size: 14px; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
    .metric { border: 1px solid #e0e4e7; border-radius: 6px; padding: 16px; }
    .metric strong { display: block; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e4e7e9; text-align: left; font-size: 14px; }
    th { color: #59636b; font-weight: 600; }
    #results { display:none; margin-top: 20px; }
  </style>
</head>
<body>
<header><h1>Clark Dietz · Drawing Review</h1></header>
<main>
  <section class="card">
    <h2>Wastewater Drawing Set</h2>
    <p class="muted">Upload a PDF to create the sheet index and begin infrastructure extraction.</p>
    <form id="uploadForm" class="upload">
      <input id="file" name="file" type="file" accept="application/pdf" required />
      <button class="primary" type="submit">Analyze Drawings</button>
      <span id="status" class="muted"></span>
    </form>

    <div id="results">
      <div class="summary">
        <div class="metric"><span class="muted">Sheets</span><strong id="sheetCount">0</strong></div>
        <div class="metric"><span class="muted">Gravity Sewer</span><strong>—</strong></div>
        <div class="metric"><span class="muted">Force Main</span><strong>—</strong></div>
        <div class="metric"><span class="muted">Lift Stations</span><strong>—</strong></div>
      </div>
      <h3>Sheet Index</h3>
      <table>
        <thead><tr><th>Page</th><th>Sheet</th><th>Classification</th><th>Confidence</th></tr></thead>
        <tbody id="sheetRows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const form = document.getElementById("uploadForm");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  if (!file) return;
  status.textContent = "Reading drawing set…";
  const data = new FormData();
  data.append("file", file);
  try {
    const response = await fetch("/api/projects", { method: "POST", body: data });
    const project = await response.json();
    if (!response.ok) throw new Error(project.detail || "Upload failed.");
    document.getElementById("sheetCount").textContent = project.sheets.length;
    const rows = document.getElementById("sheetRows");
    rows.innerHTML = "";
    for (const sheet of project.sheets) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${sheet.page_number}</td><td>${sheet.sheet_number || "—"}</td><td>${sheet.classification}</td><td>${sheet.confidence}</td>`;
      rows.appendChild(tr);
    }
    document.getElementById("results").style.display = "block";
    status.textContent = "Drawing set indexed.";
  } catch (error) {
    status.textContent = error.message;
  }
});
</script>
</body>
</html>
